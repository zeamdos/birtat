<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../module/db-signup.js"></script>
</head>
<body>
<div id="result">RUNNING</div>
<script>
(async () => {
  const check = (condition, message) => { if (!condition) throw new Error(message); };
  const log = document.getElementById('result');
  const playedAudio = [];
  window.Audio = class {
    constructor(src) {
      this.src = src;
      this.paused = true;
      playedAudio.push(this);
    }
    play() {
      this.paused = false;
      return Promise.resolve();
    }
    pause() {
      this.paused = true;
    }
  };

  try {
    localStorage.removeItem('db_signup_state_v1');
    const component = document.createElement('db-signup');
    component.setAttribute('lang', 'en');
    component.setAttribute('sign', 'true');
    document.body.appendChild(component);
    await new Promise(resolve => setTimeout(resolve, 500));

    const canvas = component.shadowRoot.querySelector('#ethsl-canvas');
    check(canvas, 'Animated interpreter is missing');
    check(component.signAnimFrame !== null, 'Question animation did not start');
    check(!component.shadowRoot.querySelector('.ethsl-image'), 'Static reference image is still shown');
    check(
      playedAudio.some(audio => audio.src.endsWith('/module/audio/en/lang.mp3')),
      'Enabling EthSL did not present the current question'
    );

    component.shadowRoot.querySelector('[data-idx="1"]').click();
    await new Promise(resolve => setTimeout(resolve, 400));
    check(component.state.step === 1, 'Continue did not advance to the next question');
    check(component.signAnimFrame !== null, 'Next question animation did not start');
    check(playedAudio.some(audio => audio.src.endsWith('/module/audio/en/name.mp3')), 'Advancing did not present the next question');
    check(component.shadowRoot.querySelector('#tab-sign-cam'), 'Camera answer option is missing');
    const nameInput = component.shadowRoot.querySelector('input');
    check(nameInput, 'Manual answer input is missing');
    nameInput.value = 'Sam Test';
    nameInput.dispatchEvent(new Event('input', { bubbles: true }));
    component.shadowRoot.querySelector('[type="submit"]').click();
    component.justEnteredName = false;
    await new Promise(resolve => setTimeout(resolve, 400));
    check(component.state.step === 2, 'Manual Continue did not advance from the name question');
    check(playedAudio.some(audio => audio.src.endsWith('/module/audio/en/phone.mp3')), 'Manual Continue did not present the following question');

    component.remove();
    log.textContent = 'PASS: animated interpreter, automatic question audio, Continue, camera option, and manual input';
  } catch (error) {
    log.textContent = 'FAIL: ' + error.message;
  }
})();
</script>
</body>
</html>
